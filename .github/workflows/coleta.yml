name: Coleta de elo

on:
  schedule:
    - cron: "17 * * * *"   # a cada hora, no minuto 17 (o minuto 0 é o mais congestionado no GitHub)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora
    inputs:
      reconstruir:
        description: "Reconstruir o histórico desde o início do campeonato"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Reconstruir histórico pelas partidas
        if: ${{ inputs.reconstruir }}
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python reconstruir.py

      - name: Buscar elo na API da Riot
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python coletar.py

      - name: Salvar histórico no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/ site/dados.json site/partidas.json
          git diff --cached --quiet || git commit -m "Elo de $(TZ=America/Sao_Paulo date '+%F %H:%M')"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
