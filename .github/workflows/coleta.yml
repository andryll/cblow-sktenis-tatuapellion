name: Coleta de elo

# Disparado de hora em hora (minuto 17) pelo cron-job.org via API (workflow_dispatch);
# o agendamento do próprio GitHub não disparava neste repositório.
on:
  workflow_dispatch:        # também é o botão "Run workflow" para rodar na hora
    inputs:
      reconstruir:
        description: "Reconstruir o histórico desde o início do campeonato"
        type: boolean
        default: false
      analisar:
        description: "Gerar a análise escrita da aba Resumo agora (normalmente só sexta às 23h)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"   # o log aparece em tempo real em vez de só no fim do passo
      TEM_PRIVADO: ${{ secrets.TOKEN_PRIVADO != '' && secrets.SENHA_PRIVADO != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow cryptography anthropic   # fotos novas; abas privadas; análise do Resumo

      # Partidas do time e dos adversários e os treinos ficam no repositório privado; este é público.
      # O token precisa de Contents: Read and write no cblow-privado.
      - name: Baixar o repositório privado
        if: env.TEM_PRIVADO == 'true'
        uses: actions/checkout@v5
        with:
          repository: andryll/cblow-privado
          token: ${{ secrets.TOKEN_PRIVADO }}
          path: privado-fonte

      - name: Reconstruir histórico pelas partidas
        if: ${{ inputs.reconstruir }}
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python reconstruir.py

      - name: Buscar elo e partidas
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python coletar.py

      # A análise escrita (Claude) só é pedida sexta às 23h ou pelo botão; sem o secret, sai só com os números.
      - name: Resumo
        if: env.TEM_PRIVADO == 'true'
        continue-on-error: true   # um erro no resumo não pode impedir a publicação do site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCAR_ANALISE: ${{ inputs.analisar }}
        run: python resumo.py

      - name: Salvar histórico no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/ site/dados.json site/rodizio.json site/fotos/
          git diff --cached --quiet || git commit -m "Elo de $(TZ=America/Sao_Paulo date '+%F %H:%M')"
          git pull --rebase --quiet   # alguém pode ter subido código durante a coleta
          git push

      - name: Salvar partidas no repositório privado
        if: env.TEM_PRIVADO == 'true'
        working-directory: privado-fonte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partidas.json partidas_adversarios.json $(ls analise.json 2>/dev/null)
          git diff --cached --quiet || git commit -m "Partidas de $(TZ=America/Sao_Paulo date '+%F %H:%M')"
          git pull --rebase --quiet   # os treinos podem ter sido editados durante a coleta
          git push

      # Só versões criptografadas vão para site/ (e nem elas entram no git).
      - name: Criptografar as abas privadas
        if: env.TEM_PRIVADO == 'true'
        env:
          SENHA_PRIVADO: ${{ secrets.SENHA_PRIVADO }}
        run: |
          python privado.py
          rm -rf privado-fonte privado-saida

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
