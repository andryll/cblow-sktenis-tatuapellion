name: Coleta de elo

# Disparado de hora em hora (minuto 17) pelo cron-job.org via API (workflow_dispatch);
# o agendamento do próprio GitHub não disparava neste repositório.
on:
  workflow_dispatch:        # também é o botão "Run workflow" para rodar na hora
    inputs:
      reconstruir:
        description: "Reconstruir o histórico desde o início do campeonato"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow   # só para reduzir fotos novas

      - name: Reconstruir histórico pelas partidas
        if: ${{ inputs.reconstruir }}
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python reconstruir.py

      - name: Buscar elo na API da Riot
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python coletar.py

      - name: Salvar histórico no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/ site/dados.json site/partidas.json site/scout.json site/fotos/
          git diff --cached --quiet || git commit -m "Elo de $(TZ=America/Sao_Paulo date '+%F %H:%M')"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
