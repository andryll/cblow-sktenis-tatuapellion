<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKTenis Desempenho SoloQ</title>
<link rel="icon" type="image/webp" href="fotos/time.webp">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<main>
  <header>
    <img src="fotos/time.webp" alt="">
    <div>
      <h1>SKTenis Tatuapellion · Desempenho SoloQ</h1>
      <p class="sub" id="sub">Carregando…</p>
    </div>
  </header>
  <nav class="abas">
    <a href="./">Elo</a>
    <a href="desempenho.html" aria-current="page">Desempenho SoloQ</a>
    <a href="geral.html">Desempenho geral</a>
    <a href="partidas.html">Últimas partidas</a>
    <a href="scout.html">Scout</a>
  </nav>

  <div class="quem-filtro" id="filtro" role="group" aria-label="Atleta"></div>

  <div class="tiles" id="tiles"></div>

  <section class="card">
    <h2>Vitórias e derrotas por dia</h2>
    <div class="grafico baixo"><canvas id="grafico" aria-label="Vitórias e derrotas por dia"></canvas></div>
  </section>

  <section class="card" id="sec-atletas">
    <div class="cab-secao">
      <h2>Atletas</h2>
      <label>Ordenar por
        <select class="ordem" data-tabela="tab-atletas"><option value="n">Partidas</option><option value="wr">Winrate</option><option value="kda">KDA</option><option value="cs">CS/min</option><option value="dano">Dano/min</option><option value="nome">Nome</option></select>
      </label>
    </div>
    <div class="tabela-wrap"><table id="tab-atletas"></table></div>
  </section>

  <section class="card">
    <div class="cab-secao">
      <h2>Campeões</h2>
      <span class="controles">
      <label>Ordenar por
        <select class="ordem" data-tabela="tab-campeoes"><option value="n">Partidas</option><option value="wr">Winrate</option><option value="kda">KDA</option><option value="cs">CS/min</option><option value="dano">Dano/min</option><option value="nome">Nome</option></select>
      </label>
      <label>Mínimo de partidas
        <select id="min-partidas">
          <option value="1">1</option><option value="3">3</option><option value="5">5</option><option value="10">10</option>
        </select>
      </label>
      </span>
    </div>
    <div class="tabela-wrap"><table id="tab-campeoes"></table></div>
  </section>
</main>

<script>window.FILAS = ["solo"];</script>
<script src="desempenho.js"></script>
</body>
</html>
